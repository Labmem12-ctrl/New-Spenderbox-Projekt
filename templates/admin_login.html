<!DOCTYPE html>
<html lang="de">
<head>
    <title>SpenderBox – Admin Login</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #fce4ec 100%);
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(233, 30, 140, 0.15);
            text-align: center;
        }

        .logo { font-size: 48px; margin-bottom: 8px; }

        h1 {
            color: #c2185b;
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #bbb;
            font-size: 13px;
            margin-bottom: 28px;
        }

        form { display: flex; flex-direction: column; gap: 14px; }

        input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            font-family: 'Nunito', Arial, sans-serif;
            font-size: 15px;
            border: 2px solid #f0c0d8;
            border-radius: 12px;
            outline: none;
            color: #444;
            background: #fff9fb;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="password"]:focus {
            border-color: #e91e8c;
            box-shadow: 0 0 0 4px rgba(233, 30, 140, 0.1);
        }

        button {
            padding: 14px;
            font-family: 'Nunito', Arial, sans-serif;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            color: white;
            background: linear-gradient(135deg, #e91e8c, #c2185b);
            box-shadow: 0 6px 20px rgba(233, 30, 140, 0.35);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(233, 30, 140, 0.45);
        }

        .fehler {
            background: #fff0f5;
            color: #c2185b;
            font-size: 13px;
            font-weight: 600;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🔒</div>
        <h1>Admin-Bereich</h1>
        <p class="subtitle">Nur für autorisierte Personen</p>

        {% if fehler %}
        <p class="fehler">⚠️ {{ fehler }}</p>
        {% endif %}

        <form action="/admin/login" method="POST">
            <input type="password" name="passwort" placeholder="Passwort" required>
            <button type="submit">Einloggen</button>
        </form>
    </div>
</body>
</html>
